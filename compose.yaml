services:
  backend:
    build: .
    command: poetry run python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
    env_file:
      - ./.env
    ports:
      - 8000:8000

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgres/data
    restart: always
    env_file:
      - ./.env
    ports:
      - 5432:5432

volumes:
  postgres_data:
